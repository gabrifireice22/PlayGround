<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Neon Skate Rush</title>
<style>
*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;font-family:Arial,Helvetica,sans-serif;background:#090814;color:#fff}canvas{display:block}#hud{position:fixed;inset:0;pointer-events:none;z-index:5}.top{display:flex;justify-content:space-between;padding:20px 24px;text-shadow:0 2px 12px #000}.metric{font-weight:900;font-size:20px}.label{font-size:11px;text-transform:uppercase;color:#bfc7ff;letter-spacing:2px}.pill{background:rgba(10,12,38,.72);border:1px solid rgba(255,255,255,.12);border-radius:14px;padding:9px 14px;backdrop-filter:blur(8px)}#speed{color:#59f0ff}#score{color:#ffd84a}
#overlay{position:fixed;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;background:linear-gradient(90deg,rgba(8,7,28,.76),rgba(8,7,28,.18));}.card{margin-right:min(48vw,640px);width:min(410px,82vw);padding:28px;border:1px solid rgba(255,255,255,.16);border-radius:24px;background:rgba(11,12,42,.86);box-shadow:0 30px 70px rgba(0,0,0,.45);backdrop-filter:blur(14px)}h1{margin:4px 0 8px;font-size:58px;line-height:.88;letter-spacing:-4px}.accent{color:#ffce3a}.card p{color:#bec5e8;line-height:1.5}.card button{width:100%;border:0;border-radius:14px;padding:16px;font-size:16px;font-weight:900;color:#11132b;background:#69efff;cursor:pointer;pointer-events:auto}.hidden{display:none!important}.controls{position:fixed;z-index:7;bottom:18px;left:50%;transform:translateX(-50%);display:flex;gap:10px;pointer-events:none}.ctrl{pointer-events:auto;width:68px;height:68px;border-radius:50%;border:1px solid rgba(255,255,255,.22);background:rgba(12,15,48,.7);color:#fff;font-size:28px;touch-action:none}.jump{margin-left:20px;border-color:#ffe168}.shake{animation:shake .28s}@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
@media(max-width:700px){.card{margin:0}.top{padding:12px}.metric{font-size:16px}h1{font-size:46px}.controls{bottom:12px}}
</style></head><body>
<div id="hud"><div class="top"><div class="pill"><div class="label">Distancia</div><div id="score" class="metric">0 m</div></div><div class="pill"><div class="label">Velocidad</div><div id="speed" class="metric">45 km/h</div></div></div></div>
<div id="overlay"><div class="card"><div class="label">Ciudad de neón · Modo infinito</div><h1>NEON<br><span class="accent">SKATE</span></h1><p>Esquiva barreras, conos y señales. Mantén el impulso y supera tu mejor distancia.</p><button id="play">PATINA AHORA</button></div></div>
<div class="controls"><button class="ctrl" id="left" aria-label="Izquierda">←</button><button class="ctrl" id="right" aria-label="Derecha">→</button><button class="ctrl jump" id="jump" aria-label="Saltar">↑</button></div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.163.0/build/three.module.js';
const scene=new THREE.Scene(); scene.background=new THREE.Color(0x080824); scene.fog=new THREE.Fog(0x080824,18,85);
const camera=new THREE.PerspectiveCamera(60,innerWidth/innerHeight,.1,150); camera.position.set(0,5.2,10.5); camera.lookAt(0,1.7,-8);
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'}); renderer.setPixelRatio(Math.min(devicePixelRatio,2)); renderer.setSize(innerWidth,innerHeight); renderer.shadowMap.enabled=true; renderer.shadowMap.type=THREE.PCFSoftShadowMap; document.body.prepend(renderer.domElement);
scene.add(new THREE.HemisphereLight(0x9dcaff,0x101023,2.1)); const sun=new THREE.DirectionalLight(0xffffff,3); sun.position.set(-8,14,8); sun.castShadow=true; sun.shadow.mapSize.set(1024,1024); scene.add(sun);
// Road
const road=new THREE.Mesh(new THREE.PlaneGeometry(12,240),new THREE.MeshStandardMaterial({color:0x17172d,roughness:.65,metalness:.15})); road.rotation.x=-Math.PI/2; road.position.z=-65; road.receiveShadow=true; scene.add(road);
for(let i=0;i<20;i++){const line=new THREE.Mesh(new THREE.PlaneGeometry(.12,3),new THREE.MeshBasicMaterial({color:0x8d91bb}));line.rotation.x=-Math.PI/2;line.position.set(0,-.01,-i*12+5);scene.add(line)}
// Sidewalk and neon horizon
for(const s of [-1,1]){const side=new THREE.Mesh(new THREE.BoxGeometry(2.2,.15,240),new THREE.MeshStandardMaterial({color:0x282943}));side.position.set(s*7,-.02,-65);side.receiveShadow=true;scene.add(side);for(let i=0;i<32;i++){const pole=new THREE.Mesh(new THREE.CylinderGeometry(.045,.06,3.8,8),new THREE.MeshStandardMaterial({color:0x3d4062,metalness:.8}));pole.position.set(s*(7.8),1.9,-i*7);scene.add(pole);const lamp=new THREE.Mesh(new THREE.SphereGeometry(.12,12,8),new THREE.MeshBasicMaterial({color:i%2?0xff49c8:0x41dcff}));lamp.position.set(s*(7.8),3.75,-i*7);scene.add(lamp)}}
// Character
const player=new THREE.Group(); scene.add(player);
const shirt=new THREE.Mesh(new THREE.CapsuleGeometry(.55,.85,5,10),new THREE.MeshStandardMaterial({color:0xf5b62c,roughness:.45}));shirt.position.y=1.55;shirt.castShadow=true;player.add(shirt);
const jeansMat=new THREE.MeshStandardMaterial({color:0x2b61aa,roughness:.75});
for(const x of [-.28,.28]){const leg=new THREE.Mesh(new THREE.CapsuleGeometry(.18,.82,4,8),jeansMat);leg.position.set(x,.62,0);leg.castShadow=true;player.add(leg)}
const board=new THREE.Mesh(new THREE.BoxGeometry(1.25,.12,2.55),new THREE.MeshStandardMaterial({color:0xe93e96,roughness:.3,metalness:.2}));board.position.y=.12;board.castShadow=true;player.add(board);
for(const x of [-.42,.42])for(const z of [-.75,.75]){const wheel=new THREE.Mesh(new THREE.CylinderGeometry(.12,.12,.09,12),new THREE.MeshStandardMaterial({color:0x171722}));wheel.rotation.z=Math.PI/2;wheel.position.set(x,.03,z);player.add(wheel)}
// Exact attached face image
const tex=new THREE.TextureLoader().load('./assets/character-face.jpg'); tex.colorSpace=THREE.SRGBColorSpace;
const head=new THREE.Mesh(new THREE.SphereGeometry(.72,32,20),new THREE.MeshStandardMaterial({map:tex,roughness:.55}));head.position.y=2.75;head.scale.set(1,.9,1);head.castShadow=true;player.add(head);
for(const x of [-.62,.62]){const shoe=new THREE.Mesh(new THREE.BoxGeometry(.48,.22,.82),new THREE.MeshStandardMaterial({color:0xf5f5f5}));shoe.position.set(x,.18,.28);shoe.castShadow=true;player.add(shoe)}
player.position.set(0,0,2);
const obstacles=[]; const lanes=[-3.6,0,3.6]; let running=false, lane=1,targetX=0,vy=0,y=0,best=Number(localStorage.getItem('neonBest')||0),distance=0,speed=18,lastSpawn=0;
function makeObstacle(z){const type=Math.floor(Math.random()*3),laneNo=Math.floor(Math.random()*3),g=new THREE.Group();g.position.set(lanes[laneNo],0,z);const red=0xff465f,orange=0xffad32;if(type===0){const b=new THREE.Mesh(new THREE.BoxGeometry(2.6,1.15,.55),new THREE.MeshStandardMaterial({color:red,roughness:.4}));b.position.y=.575;b.castShadow=true;g.add(b);for(let x=-.9;x<=.9;x+=.9){const stripe=new THREE.Mesh(new THREE.BoxGeometry(.55,.08,.58),new THREE.MeshBasicMaterial({color:0xffe4a3}));stripe.position.set(x,1.13,0);g.add(stripe)}}else if(type===1){for(let i=0;i<3;i++){const c=new THREE.Mesh(new THREE.ConeGeometry(.38,1.25,12),new THREE.MeshStandardMaterial({color:orange,roughness:.5}));c.position.set((i-1)*.75,.625,0);c.castShadow=true;g.add(c)}}else{const sign=new THREE.Mesh(new THREE.BoxGeometry(2.1,1.5,.18),new THREE.MeshStandardMaterial({color:0x48a2ff,emissive:0x16366e,emissiveIntensity:.8}));sign.position.y=1.25;g.add(sign);for(const x of [-.65,.65]){const post=new THREE.Mesh(new THREE.CylinderGeometry(.07,.07,1.25,8),new THREE.MeshStandardMaterial({color:0x9da5ba,metalness:.7}));post.position.set(x,.625,0);g.add(post)}}scene.add(g);obstacles.push(g)}
for(let i=0;i<9;i++)makeObstacle(-18-i*14);
const overlay=document.querySelector('#overlay'),play=document.querySelector('#play');play.onclick=()=>{running=true;overlay.classList.add('hidden');distance=0;speed=18};
function jump(){if(running&&y<.03){vy=7.8}}function move(d){if(!running)return;lane=Math.max(0,Math.min(2,lane+d));targetX=lanes[lane]}
addEventListener('keydown',e=>{if(e.key==='ArrowLeft'||e.key==='a')move(-1);if(e.key==='ArrowRight'||e.key==='d')move(1);if(e.key==='ArrowUp'||e.key==='w'||e.key===' ')jump();if(e.key==='r'&&!running)play.click()});
document.querySelector('#left').onclick=()=>move(-1);document.querySelector('#right').onclick=()=>move(1);document.querySelector('#jump').onclick=jump;
let tx=0;addEventListener('touchstart',e=>tx=e.touches[0].clientX);addEventListener('touchend',e=>{const dx=e.changedTouches[0].clientX-tx;if(Math.abs(dx)>35)move(dx>0?1:-1);else jump()});
const clock=new THREE.Clock();function animate(){requestAnimationFrame(animate);const dt=Math.min(clock.getDelta(),.05);const t=clock.elapsedTime;if(running){speed=Math.min(32,18+distance/250);distance+=speed*dt*.9;targetX=lanes[lane];player.position.x+= (targetX-player.position.x)*Math.min(1,dt*10);vy-=20*dt;y+=vy*dt;if(y<0){y=0;vy=0}player.position.y=y;player.rotation.z+=( -player.position.x*.07-player.rotation.z)*dt*8;for(const leg of player.children){if(leg.geometry?.type==='CapsuleGeometry')leg.rotation.x=Math.sin(t*12)*.12}board.rotation.z=Math.sin(t*10)*.025;document.querySelector('#score').textContent=Math.floor(distance)+' m';document.querySelector('#speed').textContent=Math.round(speed*2.2)+' km/h';
for(let i=obstacles.length-1;i>=0;i--){const o=obstacles[i];o.position.z+=speed*dt;if(o.position.z>12){scene.remove(o);obstacles.splice(i,1);makeObstacle(-105-Math.random()*35)}if(Math.abs(o.position.z-player.position.z)<1.35&&Math.abs(o.position.x-player.position.x)<1.45&&y<1.05){running=false;best=Math.max(best,Math.floor(distance));localStorage.setItem('neonBest',best);document.querySelector('.card p').textContent=`Distancia: ${Math.floor(distance)} m · Mejor: ${best} m`;document.querySelector('h1').innerHTML='¡CHOQUE!';play.textContent='REINTENTAR';overlay.classList.remove('hidden');document.body.classList.add('shake');setTimeout(()=>document.body.classList.remove('shake'),300)}}}
else {player.position.y+= (0-player.position.y)*dt*5;board.rotation.z=Math.sin(t*3)*.015}
camera.position.x+=(player.position.x*.28-camera.position.x)*dt*3;camera.lookAt(player.position.x*.18,1.8,-8);renderer.render(scene,camera)}animate();
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
</script></body></html>
